[project]
name = "agent-harness-layer"
version = "0.1.0"
description = "Workspace root for the Agent Harness Layer scaffold and core package."
requires-python = ">=3.12"
dependencies = [
    "agent-harness==0.1.0",
]

[dependency-groups]
dev = [
    "coverage==7.15.0",
    "fastapi==0.139.0",
    "pre-commit==4.6.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.20",
]

[tool.uv.workspace]
# 根 workspace 只聚合核心包和可安装 service-app 模板；不要把生成产物或外部项目
# 放进 members，否则 import boundary 和 build 证据会失真。
members = [
    "packages/agent-harness",
    "templates/service-app",
]

[tool.uv.sources]
# 模板依赖核心包必须走 workspace source，确保本地验证覆盖当前 checkout。
agent-harness = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".codex", ".claude"]
force-exclude = true
# ruff/pyright 扫描模板和脚本，是为了防止示例代码绕过核心包边界。
src = [
    "packages/agent-harness/src",
    "scripts",
    "tests",
    "templates/service-app",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# tests 通过 pythonpath 暴露 service-app 模板，合同测试才能直接验证模板 route seam。
addopts = "-q"
pythonpath = [".", "templates/service-app"]
testpaths = ["tests"]

[tool.pyright]
# strict 模式覆盖模板代码；模板一旦复制出去，类型边界也要可维护。
venvPath = "."
venv = ".venv"
include = [
    "packages/agent-harness/src",
    "scripts",
    "tests",
    "templates/service-app",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "dist",
]
extraPaths = [
    "packages/agent-harness/src",
    "templates/service-app",
    "templates/service-app/scripts",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
