profile: local
storage:
  kind: sqlite
  root: .agent-harness/local
  dsn: sqlite+aiosqlite:///.agent-harness/local/agent_harness.db
queue:
  kind: in-memory
observability:
  kind: local-jsonl
  path: .agent-harness/traces.jsonl
policy:
  provider: yaml
  require_approval_actions:
    - shell.execute
    - file.delete
    - external.network
model:
  provider: fake
  requires_api_key: false
  default_model: fake-local
  timeout_seconds: 30
budget:
  max_tokens_per_run: 8192
identity:
  default:
    tenant_id: default
    user_id: local-user
    session_id: local-session
    roles:
      - admin
    permissions:
      - "*"
    auth_method: local
service:
  api_process:
    enabled: false
  worker_process:
    enabled: false
