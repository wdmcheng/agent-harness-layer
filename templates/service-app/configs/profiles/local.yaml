profile: local
storage:
  kind: sqlite
  root: .agent-harness/local
  dsn: sqlite+aiosqlite:///.agent-harness/local/agent_harness.db
queue:
  kind: in-memory
observability:
  kind: local-jsonl
  path: .agent-harness/traces.jsonl
auth:
  provider: local
  required: false
policy:
  provider: yaml
  path: configs/policy/default.yaml
  require_approval_actions:
    - shell.execute
    - file.delete
    - file.bulk_write
    - external.network
    - mcp.connect
    - message.send
    - ticket.create
    - email.send
    - workspace.write_outside
    - dataset.write_approved
    - policy.modify
    - policy.update
    - input.prompt_injection
model:
  provider: fake
  requires_api_key: false
  default_model: fake-local
  timeout_seconds: 30
budget:
  max_tokens_per_run: 8192
identity:
  default:
    tenant_id: default
    user_id: local-user
    session_id: local-session
    roles:
      - admin
    permissions:
      - "*"
    auth_method: local
service:
  api_process:
    enabled: false
  worker_process:
    enabled: false
