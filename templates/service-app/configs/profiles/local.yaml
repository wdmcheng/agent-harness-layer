profile: local
storage:
  # local profile 必须保持离线可运行；SQLite 文件写入模板目录下的本地状态目录。
  kind: sqlite
  root: .agent-harness/local
  dsn: sqlite+aiosqlite:///.agent-harness/local/agent_harness.db
queue:
  # local smoke 不依赖外部队列服务。
  kind: in-memory
observability:
  # 本地 trace 使用 JSONL，方便测试和人工审查直接读取。
  kind: local-jsonl
  path: .agent-harness/traces.jsonl
auth:
  # local profile 默认不要求认证；需要模拟 token 时用 `.env` 注入 dev bearer token。
  provider: local
  required: false
policy:
  # YAML policy 是模板默认 provider；DB provider 留给 service profile 或部署配置切换。
  provider: yaml
  path: configs/policy/default.yaml
  require_approval_actions:
    - shell.execute
    - file.delete
    - file.bulk_write
    - external.network
    - mcp.connect
    - message.send
    - ticket.create
    - email.send
    - workspace.write_outside
    - dataset.write_approved
    - policy.modify
    - policy.update
    - input.prompt_injection
tools:
  workspace:
    ignore_file: .agentignore
    inline_result_bytes: 1024
  # 示例显式启用有限只读命令；shell.execute 仍由 policy 默认要求人工审批。
  shell:
    enabled: true
    allowlist:
      - echo
      - pwd
      - git
      - python
      - python3
    denylist:
      - rm
      - sudo
      - curl
      - wget
    env_whitelist: []
    timeout_seconds: 30
    inline_output_bytes: 8192
model:
  # fake provider 是离线 smoke 默认值，不需要真实模型 key。
  provider: fake
  requires_api_key: false
  default_model: fake-local
  timeout_seconds: 30
budget:
  max_tokens_per_run: 8192
identity:
  # 默认身份只用于 local/dev seam；service profile 开启认证后由 token verifier 映射。
  default:
    tenant_id: default
    user_id: local-user
    session_id: local-session
    roles:
      - admin
    permissions:
      - "*"
    auth_method: local
service:
  # local profile 不自动拆 API/worker 进程，避免 smoke 依赖后台服务。
  api_process:
    enabled: false
  worker_process:
    enabled: false
  api_docs:
    # 本地开发默认开放管理面，并自托管锁定资源以支持无外网使用。
    enabled: true
    asset_mode: offline
