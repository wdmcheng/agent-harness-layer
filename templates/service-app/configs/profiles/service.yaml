profile: service
storage:
  # service 进程必须由 direct env 或受控 `_FILE` 注入 DSN；profile 不保存凭据。
  kind: postgresql
  dsn: null
queue:
  # API 与 worker 只依赖 RunQueue protocol；composition root 注入 RedisRunQueue。
  # adapter 用 Streams 实现 enqueue/pickup/reclaim，并只在结果持久化后 fenced ACK；
  # service smoke 同时验证 Redis reachability。
  kind: redis
  dsn: redis://localhost:56379/0
observability:
  # service smoke 仍使用本地 JSONL trace，避免需要外部 observability provider。
  kind: local-jsonl
  path: .agent-harness/service-traces.jsonl
  # 外部 provider 是 optional fan-out。默认 disabled，避免 service smoke 依赖 SaaS key；
  # 启用时只提交 env 名称或 endpoint，不把真实 token 写进 profile。
  providers:
    - kind: otel
      enabled: false
      endpoint: http://localhost:4318/v1/traces
    - kind: logfire
      enabled: false
      token_env: LOGFIRE_TOKEN
    - kind: phoenix
      enabled: false
      endpoint: http://127.0.0.1:6006/v1/traces
    - kind: langfuse
      enabled: false
      token_env: LANGFUSE_SECRET_KEY
auth:
  # service profile 默认要求 API key / bearer token；不要在模板里提交真实 token。
  provider: api-key
  required: true
policy:
  # 默认仍从 YAML 读策略；切 DB provider 时要先准备 policy_rules 数据。
  provider: yaml
  path: configs/policy/default.yaml
  require_approval_actions:
    - shell.execute
    - file.delete
    - file.bulk_write
    - external.network
    - mcp.connect
    - message.send
    - ticket.create
    - email.send
    - model.over_budget
    - workspace.write_outside
    - dataset.write_approved
    - policy.modify
    - policy.update
    - input.prompt_injection
tools:
  workspace:
    ignore_file: .agentignore
    inline_result_bytes: 1024
  # service 示例保持同一 allowlist；审批通过也不能越过命令和 workspace preflight。
  shell:
    enabled: true
    allowlist:
      - echo
      - pwd
      - git
      - python
      - python3
    denylist:
      - rm
      - sudo
      - curl
      - wget
    env_whitelist: []
    timeout_seconds: 30
    inline_output_bytes: 8192
model:
  # 默认 fake provider 保证 service smoke 不依赖外部模型服务。
  provider: fake
  requires_api_key: false
  default_model: fake-service
  timeout_seconds: 60
  default_deployment_id: fake_default
  # service 默认仍是同一离线 deployment；真实配置必须通过品牌 typed boundary 显式注入。
  deployments:
    fake_default:
      provider_kind: fake
      allowed_models: [fake-local, fake-service, fake-basic, fake-dev-assistant, fake-rag, fake-repo-analyst, fake-ticket-triage, fake-scaffold]
      default_model: fake-service
      fallback_models: []
      max_prompt_utf8_bytes: 16384
      max_output_tokens: 16384
      max_per_attempt_token_bound: 32768
      capabilities: [text_completion]
budget:
  max_tokens_per_run: 16384
identity:
  # 这里只是认证解析后的默认字段模板，不代表绕过 auth.required。
  default:
    tenant_id: default
    user_id: local-user
    session_id: service-session
    roles:
      - admin
    permissions:
      - "*"
    auth_method: api-key
service:
  # service profile 会拆 API 和 worker 进程；端口必须和 compose/service smoke 保持一致。
  api_process:
    enabled: true
    host: 127.0.0.1
    port: 8000
  worker_process:
    enabled: true
  api_docs:
    # 正式服务默认不暴露 OpenAPI/Swagger/Redoc；排障时由部署环境显式开启。
    enabled: false
    # 开启后仍默认自托管；只有显式 online 才允许浏览器请求 CDN。
    asset_mode: offline
