profile: service
storage:
  # service smoke 必须连真实 PostgreSQL；不要把这里替换成 SQLite 来伪造通过。
  kind: postgresql
  dsn: postgresql+asyncpg://agent_harness:agent_harness@localhost:55432/agent_harness
queue:
  # Redis 当前用于 service profile reachability 和未来 worker queue seam。
  kind: redis
  dsn: redis://localhost:56379/0
observability:
  # service smoke 仍使用本地 JSONL trace，避免需要外部 observability provider。
  kind: local-jsonl
  path: .agent-harness/service-traces.jsonl
  # 外部 provider 是 optional fan-out。默认 disabled，避免 service smoke 依赖 SaaS key；
  # 启用时只提交 env 名称或 endpoint，不把真实 token 写进 profile。
  providers:
    - kind: otel
      enabled: false
      endpoint: http://localhost:4318/v1/traces
    - kind: logfire
      enabled: false
      token_env: LOGFIRE_TOKEN
    - kind: phoenix
      enabled: false
      endpoint: http://127.0.0.1:6006/v1/traces
    - kind: langfuse
      enabled: false
      token_env: LANGFUSE_SECRET_KEY
auth:
  # service profile 默认要求 API key / bearer token；不要在模板里提交真实 token。
  provider: api-key
  required: true
policy:
  # 默认仍从 YAML 读策略；切 DB provider 时要先准备 policy_rules 数据。
  provider: yaml
  path: configs/policy/default.yaml
  require_approval_actions:
    - shell.execute
    - file.delete
    - file.bulk_write
    - external.network
    - mcp.connect
    - message.send
    - ticket.create
    - email.send
    - model.over_budget
    - workspace.write_outside
    - dataset.write_approved
    - policy.modify
    - policy.update
    - input.prompt_injection
model:
  # 默认 fake provider 保证 service smoke 不依赖外部模型服务。
  provider: fake
  requires_api_key: false
  default_model: fake-service
  timeout_seconds: 60
budget:
  max_tokens_per_run: 16384
identity:
  # 这里只是认证解析后的默认字段模板，不代表绕过 auth.required。
  default:
    tenant_id: default
    user_id: local-user
    session_id: service-session
    roles:
      - admin
    permissions:
      - "*"
    auth_method: api-key
service:
  # service profile 会拆 API 和 worker 进程；端口必须和 compose/service smoke 保持一致。
  api_process:
    enabled: true
    host: 127.0.0.1
    port: 8000
  worker_process:
    enabled: true
