profile: service
storage:
  kind: postgresql
  dsn: postgresql+asyncpg://agent_harness:agent_harness@localhost:55432/agent_harness
queue:
  kind: redis
  dsn: redis://localhost:56379/0
observability:
  kind: local-jsonl
  path: .agent-harness/service-traces.jsonl
auth:
  provider: api-key
  required: true
policy:
  provider: yaml
  path: configs/policy/default.yaml
  require_approval_actions:
    - shell.execute
    - file.delete
    - file.bulk_write
    - external.network
    - mcp.connect
    - message.send
    - ticket.create
    - email.send
    - model.over_budget
    - workspace.write_outside
    - dataset.write_approved
    - policy.modify
    - policy.update
    - input.prompt_injection
model:
  provider: fake
  requires_api_key: false
  default_model: fake-service
  timeout_seconds: 60
budget:
  max_tokens_per_run: 16384
identity:
  default:
    tenant_id: default
    user_id: local-user
    session_id: service-session
    roles:
      - admin
    permissions:
      - "*"
    auth_method: api-key
service:
  api_process:
    enabled: true
    host: 127.0.0.1
    port: 8000
  worker_process:
    enabled: true
