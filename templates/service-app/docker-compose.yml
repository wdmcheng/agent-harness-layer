name: agent-harness-service-app

x-runtime-environment: &runtime-environment
  AGENT_HARNESS_STORAGE__DSN: postgresql+asyncpg://agent_harness:agent_harness@postgres:5432/agent_harness
  AGENT_HARNESS_QUEUE__DSN: redis://redis:6379/0
  SERVICE_APP_EXECUTOR_ID: agent-harness-service-worker
  SERVICE_APP_RECLAIM_IDLE_SECONDS: ${SERVICE_APP_RECLAIM_IDLE_SECONDS:-1}

x-runtime-service: &runtime-service
  build:
    context: .
    dockerfile: Dockerfile
  image: ${SERVICE_APP_IMAGE:-agent-harness-service-app:smoke}
  profiles: ["service"]
  environment: *runtime-environment
  volumes:
    - ${SERVICE_APP_SMOKE_DIR:?SERVICE_APP_SMOKE_DIR is required}:/smoke

services:
  postgres:
    image: ${SERVICE_APP_POSTGRES_IMAGE:-postgres:18}
    profiles: ["service"]
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: agent_harness
      POSTGRES_PASSWORD: agent_harness
    volumes:
      - agent_harness_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_harness -d agent_harness"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: ${SERVICE_APP_REDIS_IMAGE:-redis:8.0.1}
    profiles: ["service"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  migration:
    <<: *runtime-service
    command:
      - python
      - -c
      - "import os; from agent_harness.storage import run_migrations; run_migrations(os.environ['AGENT_HARNESS_STORAGE__DSN'])"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime-service
    command:
      - agent-harness-service
      - serve
      - --profile
      - service
      - --profiles-dir
      - /app/configs/profiles
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${SERVICE_APP_API_PORT:-58000}:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *runtime-service
    command:
      - python
      - -m
      - app.workers.runtime_worker
      - --profile
      - service
      - --profiles-dir
      - /app/configs/profiles
      - --workspace-root
      - /smoke/workspace
      - --artifact-root
      - /smoke/artifacts
    environment:
      <<: *runtime-environment
      SERVICE_APP_READY_FILE: /tmp/runtime-worker-ready
      SERVICE_APP_SMOKE_RECOVERY_MARKER: /smoke/recovery-handler.json
      SERVICE_APP_SMOKE_RECEIPT_MARKER: /smoke/worker-b-receipt.json
      SERVICE_APP_SMOKE_RECLAIM_RELEASE: /smoke/reclaim-release
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/runtime-worker-ready"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  agent_harness_postgres_data:
