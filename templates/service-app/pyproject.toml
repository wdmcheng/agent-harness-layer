[project]
name = "agent-harness-service-app"
version = "0.1.0"
description = "Backend service application template for Agent Harness Layer."
requires-python = ">=3.12"
dependencies = [
    "agent-harness==0.1.0",
    "fastapi>=0.139.0,<0.140",
    "typer>=0.26.8,<0.27",
    "uvicorn>=0.50.2,<0.51",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.20,<0.16",
]

[project.scripts]
# 这里只暴露 app-specific serve；agents/run/approvals/eval/policy 继续由核心 CLI 提供。
agent-harness-service = "app.cli.main:main"

[build-system]
requires = ["hatchling>=1.30.1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# service-app wheel 只包含模板 app 和示例 agent，不携带根仓库 tests/scripts。
packages = ["app", "agents"]

[tool.uv.sources]
# 源 workspace 内重复声明核心包来源，供 uv 与 PyCharm 建立成员依赖；复制项目的
# bootstrap 会在同步前把它替换为可信 artifact/path，或在显式 index 模式下删除。
agent-harness = { workspace = true }

[tool.pyright]
# 当前 PyCharm 不会可靠继承根 workspace 的环境选择，因此这里显式指向仓库根
# `.venv`。复制项目第一次 bootstrap 会把 venvPath 归一化为 `.`。
venvPath = "../.."
venv = ".venv"
