[project]
name = "agent-harness-service-app"
version = "0.1.0"
description = "Backend service application template for Agent Harness Layer."
requires-python = ">=3.12"
dependencies = [
    "agent-harness==0.1.0",
    "fastapi>=0.139.0,<0.140",
    "typer>=0.26.8,<0.27",
    "uvicorn>=0.50.2,<0.51",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.20,<0.16",
]

[project.scripts]
# 这里只暴露 app-specific serve；agents/run/approvals/eval/policy 继续由核心 CLI 提供。
agent-harness-service = "app.cli.main:main"

[build-system]
requires = ["hatchling>=1.30.1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# service-app wheel 只包含模板 app 和示例 agent，不携带根仓库 tests/scripts。
packages = ["app", "agents"]

[tool.pyright]
# 项目约定使用 uv 默认的项目内 `.venv`，让 IDE 中独立运行的 Pyright
# 也能解析已同步依赖；自定义 UV_PROJECT_ENVIRONMENT 时需同步调整本机工具配置。
venvPath = "."
venv = ".venv"
