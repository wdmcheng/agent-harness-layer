[project]
name = "agent-harness-service-app"
version = "0.1.0"
description = "Backend service application template for Agent Harness Layer."
requires-python = ">=3.12"
dependencies = [
    "agent-harness==0.1.0",
    "fastapi==0.139.0",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.uv.sources]
# 模板开发态必须引用 workspace 核心包；发布模板时再替换成版本化依赖。
agent-harness = { workspace = true }

[tool.hatch.build.targets.wheel]
# service-app wheel 只包含模板 app 和示例 agent，不携带根仓库 tests/scripts。
packages = ["app", "agents"]
