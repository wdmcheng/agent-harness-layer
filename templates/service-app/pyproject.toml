[project]
name = "agent-harness-service-app"
version = "0.1.0"
description = "Backend service application template for Agent Harness Layer."
requires-python = ">=3.12"
dependencies = [
    "agent-harness==0.1.0",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-harness = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app", "agents"]
