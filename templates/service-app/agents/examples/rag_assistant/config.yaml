agent_id: examples.rag_assistant
version: 0.1.0
# RAG 示例强制穿过 retrieval、ContextAssembler 和 fake ModelProvider。
name: RAG Assistant Example
description: Offline RAG assistant fixture with citation-aware retrieval.
input_schema: agents.examples.rag_assistant.schemas.RagInput
output_schema: agents.examples.rag_assistant.schemas.RagOutput
executor: agent:executor
model:
  provider: fake
  default_model: fake-rag
  fallback_models: []
budget:
  max_tokens_per_run: 8192
  max_cost_usd_per_run: null
tool_allowlist:
  - retrieval.query
eval_dataset: agents/examples/rag_assistant/evals
delegation_edges: []
