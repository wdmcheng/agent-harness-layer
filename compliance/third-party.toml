[project]
license_expression = "Apache-2.0"
allowed_expressions = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "0BSD", "CC0-1.0", "Elastic-2.0", "LGPL-3.0-only", "LGPL-3.0-or-later", "MIT-0",
  "MPL-2.0", "PSF-2.0", "Python-2.0", "Unlicense", "Zlib",
  "MIT OR Python-2.0", "Apache-2.0 OR BSD-3-Clause",
  "Apache-2.0 OR BSD-2-Clause", "Apache-2.0 AND BSD-2-Clause",
  "MPL-2.0 AND MIT", "MPL-2.0 AND (Apache-2.0 OR MIT)",
  "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0",
]
denied_expressions = ["GPL-3.0-only", "AGPL-3.0-only", "SSPL-1.0"]

[tool.licensecheck]
