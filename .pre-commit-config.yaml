repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: import-boundary
        name: import boundary check
        entry: uv run python scripts/import_boundary_check.py
        language: system
        pass_filenames: false
      - id: license-check
        name: license check
        entry: uv run --group license python scripts/license_check.py
        language: system
        pass_filenames: false
